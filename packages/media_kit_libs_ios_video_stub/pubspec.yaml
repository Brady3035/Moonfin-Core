# Stub replacing media_kit_libs_ios_video (see dependency_overrides in the
# root pubspec). iOS playback runs entirely on AetherEngine, so the libmpv/
# FFmpeg xcframeworks this package would pull into the iOS build are dead
# weight. This stub has no plugin declaration and no podspec, so pod install
# links nothing. media_kit itself stays for Android/desktop.
name: media_kit_libs_ios_video
description: Stub package excluding libmpv native libraries from the iOS build.
version: 1.1.4
publish_to: none

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
